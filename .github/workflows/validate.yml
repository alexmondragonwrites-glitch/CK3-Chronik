name: Datenqualität
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Skripte prüfen
        run: |
          node --check assets/chronik.js
          node --check assets/portal.js
          node --check assets/musterblatt.js
          node --check scripts/validate-data.mjs
          node --check scripts/test-pruefung.mjs
          node --check scripts/kontrast.mjs
          node --check scripts/new-save.mjs
          python3 -m py_compile scripts/monitor_daten.py scripts/publish-monitor.py scripts/privat-pruefen.py scripts/test-monitor-daten.py scripts/ornamente.py scripts/schriften.py
      - name: Daten und Datenschutz prüfen
        run: |
          node scripts/validate-data.mjs
          node scripts/test-pruefung.mjs
          python3 scripts/test-monitor-daten.py
      - name: Erscheinungsbild prüfen
        run: |
          python3 scripts/ornamente.py --pruefen
          node scripts/kontrast.mjs
      - name: Neuen Lauf anlegen testen
        run: |
          node scripts/new-save.mjs --id ci-test --name "Haus Probe" --untertitel "Testlauf" --started 2026-11-17 --version "1.21" --farbe gruen --stil ranke
          node scripts/validate-data.mjs
